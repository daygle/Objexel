services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: objexel
      POSTGRES_USER: objexel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - objexel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objexel -d objexel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    # Pull the published release image by default; `docker compose up -d --build`
    # still builds from source and tags the result as this same reference.
    # Pin a version for upgrades/rollbacks with OBJEXEL_IMAGE_TAG (e.g. v0.2.0).
    image: ghcr.io/daygle/objexel:${OBJEXEL_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://objexel:${POSTGRES_PASSWORD:-change-me}@postgres:5432/objexel
      RUST_LOG: ${RUST_LOG:-info}
      OBJEXEL_STORAGE_DIR: /var/lib/objexel
      OBJEXEL_MODEL_DIR: /models
      OBJEXEL_COOKIE_SECURE: ${OBJEXEL_COOKIE_SECURE:-0}
    ports:
      - "8080:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./models:/models
      - ./recordings:/var/lib/objexel/recordings
      - ./clips:/var/lib/objexel/clips
      - ./snapshots:/var/lib/objexel/snapshots
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  objexel-postgres:
