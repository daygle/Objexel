services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: objexel
      POSTGRES_USER: objexel
      POSTGRES_PASSWORD: objexel
    ports:
      - "5432:5432"
    volumes:
      - objexel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objexel -d objexel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://objexel:objexel@postgres:5432/objexel
      RUST_LOG: info
    ports:
      - "8080:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  objexel-postgres:
