version: 2
updates:
  # Rust workspace (root Cargo.toml / Cargo.lock)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Web dashboard (SvelteKit) dependencies
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # svelte-check@4.7.6 (latest) declares peer typescript "^5.0.0 || ^6.0.0",
      # so a TypeScript 7 bump makes `npm ci` fail with ERESOLVE. Remove this
      # ignore once svelte-check widens its peer range to include 7.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI and release workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Base images referenced by the container build
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
