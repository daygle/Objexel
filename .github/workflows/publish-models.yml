name: Publish model weights

# Builds the YOLO11/YOLO26 ONNX family and publishes it to a GitHub release so the
# built-in catalog's one-click downloads work — without anyone running Python locally.
# Trigger it from the Actions tab ("Run workflow"), or by pushing a tag like `models-v1`.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the ONNX assets to"
        default: "models-v1"
        required: true
  push:
    tags:
      - "models-*"

permissions:
  contents: write

concurrency:
  group: publish-models-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install exporter dependencies
        # Pin torch + ultralytics so the ONNX bytes (and their SHA-256 digests) match the
        # checksums committed in models/catalog.json. The CPU wheel is smaller and faster;
        # it produces the same exported graph and weights as any other build.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.157" onnx

      - name: Export ONNX model family
        run: python scripts/export_models.py --out dist/models --release-tag "${{ steps.tag.outputs.value }}"

      - name: Publish ONNX assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Objexel model weights ${{ steps.tag.outputs.value }}
          body: "YOLO11 and YOLO26 ONNX exports for the Objexel built-in catalog. Generated by the Publish model weights workflow."
          files: dist/models/*.onnx
          fail_on_unmatched_files: true

      - name: Reconcile catalog checksums
        # export_models.py rewrites models/catalog.json to match the files it produced.
        # If the digests drifted from what is committed (e.g. a newer dependency), push the
        # refreshed manifest so builds and the "Refresh catalog" action agree with the
        # uploaded assets. Non-fatal: the assets are already published if this is blocked.
        continue-on-error: true
        run: |
          if ! git diff --quiet -- models/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/catalog.json
            git commit -m "chore: refresh model catalog checksums for ${{ steps.tag.outputs.value }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
