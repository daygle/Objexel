name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      export_models:
        description: "Export ONNX model weights and publish to the release"
        type: boolean
        default: false
      release_tag:
        description: "Release tag for model assets (default: models-v1)"
        default: "models-v1"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-models:
    name: Export and publish ONNX models
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.export_models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: tag
        run: echo "value=${{ inputs.release_tag || 'models-v1' }}" >> "$GITHUB_OUTPUT"

      - name: Install exporter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ultralytics==8.4.157" onnx

      - name: Export ONNX model family
        run: python scripts/export_models.py --out dist/models --release-tag "${{ steps.tag.outputs.value }}"

      - name: Publish ONNX assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: Objexel model weights ${{ steps.tag.outputs.value }}
          body: "YOLO11 and YOLO26 ONNX exports for the Objexel built-in catalog."
          files: dist/models/*.onnx
          fail_on_unmatched_files: true

      - name: Reconcile catalog checksums
        continue-on-error: true
        run: |
          if ! git diff --quiet -- models/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add models/catalog.json
            git commit -m "chore: refresh model catalog checksums for ${{ steps.tag.outputs.value }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  release:
    name: Build and publish release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-release
            type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-release,ignore-error=true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See the generated release notes below. Upgrade operators should back up PostgreSQL and media metadata before deploying this image.
