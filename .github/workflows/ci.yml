name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Group PR runs by ref so a newer commit cancels the superseded run; give each
# push (main) run a unique group so main runs are never cancelled or queued and
# always finish to a clean status.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The existing workspace contains legacy files that are not rustfmt-clean.
      # Keep the check visible without blocking the build until the baseline is formatted.
      - name: Rust formatting (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true
      - run: cargo check --workspace
      - run: cargo test --workspace

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: objexel/api:ci
          # Scope the cache per ref so a PR run and the main run never collide on the
          # same reservation ("failed to reserve cache"), while still warming from main.
          # ignore-error keeps a transient cache hiccup from failing an otherwise good build.
          cache-from: |
            type=gha,scope=docker-${{ github.ref_name }}
            type=gha,scope=docker-main
          cache-to: type=gha,mode=max,scope=docker-${{ github.ref_name }},ignore-error=true
