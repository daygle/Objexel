[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/database",
    "crates/camera",
    "crates/detector",
    "crates/tracker",
    "crates/observations",
    "crates/pipeline",
    "crates/zones",
    "crates/rules",
    "crates/models",
    "crates/notifications",
    "crates/actions",
    "crates/recorder",
    "crates/playback",
    "crates/search",
    "crates/analytics",
    "crates/behaviour",
    "crates/fusion",
    "crates/identity",
    "crates/adaptive",
    "crates/auth",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/daygle/Objexel"

[workspace.dependencies]
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde"] }
ndarray = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate", "macros"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "process"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
utoipa = { version = "5.4", features = ["chrono", "uuid"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.8"
rumqttc = { version = "0.25", default-features = false }
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
